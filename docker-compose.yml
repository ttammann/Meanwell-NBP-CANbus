# Two services, pick one:
#
#   docker compose up demo        # in-process FakeBus, runs anywhere
#   docker compose up charger     # real CAN bus (Linux host only)
#
# The `charger` service uses host networking so the container shares the
# host's network namespace, including socketcan interfaces like can0.
# Bring the interface up on the host first:
#
#   sudo ip link set can0 up type can bitrate 250000
#
# Then `docker compose up charger` will find can0 inside the container.

services:
  demo:
    build: .
    container_name: npb-charger-demo
    ports:
      - "8080:8080"
    environment:
      NPB_LOG_FILE: ${NPB_LOG_FILE:-/tmp/npb-charger.log}
    command: ["python", "charger_web.py", "--demo", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    # /api/health is intentionally cheap (no CAN reads) — using urllib so we
    # don't depend on curl/wget being in the slim image.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles: ["demo"]

  charger:
    build: .
    container_name: npb-charger
    # macOS / Windows: use the demo profile. Real CAN profiles need Linux.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      NPB_CHANNEL: ${NPB_CHANNEL:-can0}
      NPB_BITRATE: ${NPB_BITRATE:-250000}
      NPB_CAN_ID: ${NPB_CAN_ID:-0xC0103}
      NPB_PORT:   ${NPB_PORT:-8080}
      NPB_LOG_FILE: ${NPB_LOG_FILE:-/tmp/npb-charger.log}
    command: >
      python charger_web.py
        --interface socketcan
        --channel ${NPB_CHANNEL:-can0}
        --bitrate ${NPB_BITRATE:-250000}
        --can-id  ${NPB_CAN_ID:-0xC0103}
        --host    0.0.0.0
        --port    ${NPB_PORT:-8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${NPB_PORT:-8080}/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles: ["charger"]

  # USB-CAN on Linux: pass the host tty through (not supported on Docker Desktop for Mac).
  usb-can:
    build: .
    container_name: npb-charger-usb
    ports:
      - "8080:8080"
    environment:
      NPB_LOG_FILE: ${NPB_LOG_FILE:-/tmp/npb-charger.log}
    devices:
      - "${NPB_USB_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0"
    command: >
      python charger_web.py
        --interface ${NPB_USB_INTERFACE:-slcan}
        --channel  /dev/ttyACM0
        --bitrate  ${NPB_BITRATE:-250000}
        --can-id   ${NPB_CAN_ID:-0xC0103}
        --host     0.0.0.0
        --port     8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles: ["usb-can"]
